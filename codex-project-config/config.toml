# Copy this file and the adjacent agents/ directory into this project's .codex/.
# This file is intentionally not active while the current build is running.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

developer_instructions = """
Plan before inspection, edits or delegation. Use small, verifiable implementation stages.
Do not run Git commands, create commits or worktrees, or publish until the user authorizes it.
Use Terra for substantial implementation, Luna for bounded lightweight work, and Sol or Terra for independent review.
Give parallel writers disjoint file ownership. Coordinate shared types before implementation.
Keep community data private by role. Label synthetic identities, incidents and integrations.
Keep core workflows functional without AI credentials. Validate external input and AI output.
Verify changed behavior with appropriate tests and the running application before reporting success.
Do not send messages or make external deployments without explicit authorization.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 8
default_subagent_model = "gpt-6.1-terra"
default_subagent_reasoning_effort = "high"

[agents.implementation]
description = "Implement substantial TypeScript, backend, frontend or integration work within an explicitly assigned file set."
config_file = "agents/implementation.toml"

[agents.lightweight]
description = "Handle bounded documentation, inventory, straightforward edits or narrow research tasks."
config_file = "agents/lightweight.toml"

[agents.reviewer]
description = "Independently review correctness, permissions, privacy, regression coverage and requirement completeness. Do not edit implementation files."
config_file = "agents/reviewer.toml"
